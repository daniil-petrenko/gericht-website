<section class="page__book book">
	<div class="book__container">
		<div data-watch data-watch-once data-watch-threshold="0.25" class="book__resevation reservation-book">
			<div class="reservation-book__content content-reservation content content--center">
				<div data-watch data-watch-once class="content__sub-title content-reservation__sub-title">Reservations</div>
				<div data-watch data-watch-once class="content__icon content-reservation__icon">
					<img src="img/spoon.svg" alt="Image">
				</div>
				<h2 data-watch data-watch-once class="content__title title content-reservation__title">Book A Table</h2>
			</div>
			<form action="#" class="reservation-book__form form-reservation" id="resevationForm">
				<div data-watch data-watch-once class="form-reservation__selects">
					<div class="form-reservation__item _custom-select">
						<select id="reservationPersonPicker" data-custom-select>
						  <option value="1">1 Person</option>
						  <option value="2">2 Person</option>
						  <option value="3">3 Person</option>
						  <option value="3">4 Person</option>
						  <option value="3">5 Person</option>
						  <option value="3">6 Person</option>
						</select>
					</div>
					<div class="form-reservation__item">
						<label>
					    <input id="calendar" mbsc-input placeholder="Choose Date"/>
						</label>
					</div>
					<div class="form-reservation__item">
						<label>
					    <input id="timePicker" mbsc-input placeholder="Choose Time"/>
						</label>
					</div>
				</div>
				<div class="form-reservation__item form-reservation__actions">
					<button data-watch data-watch-once type="submit" class="form-reservation__button button">Book Now</button>
				</div>
			</form>
			<div class="book__decor delight-decor _bottom">
				<div class="delight-decor__main-image">
					<img src="img/spoonsDecor.svg" alt="Decor">
				</div>
				<div class="delight-decor__rotate-image">
					<img src="img/circleWords.png" alt="Decor">
				</div>
			</div>
		</div>
	</div>
</section>
